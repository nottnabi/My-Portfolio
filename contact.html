<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Me | Kathiona</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #f48fb1, #f06292);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    .container-wrapper {
      background-color: rgba(0, 0, 0, 0.8);
      border-radius: 20px;
      margin: 20px;
      padding: 40px;
      height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    .nav-item a {
      text-decoration: none;
      color: #fff;
      transition: color 0.3s;
    }

    .nav-item a:hover,
    .nav-item.active a {
      color: #f06292;
    }

    .contact-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .contact-title {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .contact-title span {
      color: #f06292;
    }

    form {
      max-width: 600px;
      width: 100%;
      background-color: #2c1a24;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      animation: slideIn 1s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: transparent;
      border: 1px solid #f06292;
      color: white;
      border-radius: 5px;
      font-size: 1rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #f06292;
      box-shadow: 0 0 5px #f06292;
    }

    button {
      background-color: #f06292;
      border: none;
      padding: 12px 24px;
      color: white;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      display: block;
      margin: 20px auto 0;
      box-shadow: 0 0 20px #f06292;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #ff7cb6;
    }
  </style>
</head>
<body>
  <div class="container-wrapper">
    <nav class="navbar">
      <div class="logo">Kathiona</div>
      <ul class="nav-links">
        <li class="nav-item"><a href="index.html">Home</a></li>
        <li class="nav-item"><a href="aboutme.html">About Me</a></li>
        <li class="nav-item"><a href="education.html">Education</a></li>
        <li class="nav-item"><a href="skills.html">Skills</a></li>
        <li class="nav-item active"><a href="#">Contact</a></li>
      </ul>
    </nav>

    <section class="contact-section">
      <h2 class="contact-title">Contact <span>Me</span></h2>
      <form>
        <input type="text" placeholder="Email">
        <input type="text" placeholder="Phone Number">
        <input type="text" placeholder="Subject">
        <textarea rows="6" placeholder="Your Message"></textarea>
        <button type="button" onclick="sendMessage()">Send Message</button>
      </form>
    </section>
  </div>

  <script>
    function sendMessage() {
      const email = document.querySelector('input[placeholder="Email"]').value.trim();
      const phone = document.querySelector('input[placeholder="Phone Number"]').value.trim();
      const subject = document.querySelector('input[placeholder="Subject"]').value.trim();
      const message = document.querySelector('textarea[placeholder="Your Message"]').value.trim();
  
      if (!email || !phone || !subject || !message) {
        alert('Please fill in all fields before sending your message.');
        return;
      }
  
      alert(`Message Sent!\n\nEmail: ${email}\nPhone: ${phone}\nSubject: ${subject}\nMessage: ${message}`);
  
      document.querySelector('form').reset();
    }
  </script>

</body>
</html>
